name: devspace
description: A social platform for college developers — built by devs, for devs.
publish_to: 'none'
version: 1.0.8+14

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.12.1
  crypto: ^3.0.3
  shared_preferences: ^2.2.3
  google_sign_in: ^7.2.0
  firebase_core: ^4.6.0
  firebase_analytics: ^12.2.0
  firebase_crashlytics: ^5.1.0


  # ── Payments ──────────────────────────────────────
  razorpay_flutter: ^1.3.5
  flutter_secure_storage: ^9.0.0
  flutter_dotenv: ^5.1.0
  http_certificate_pinning: ^3.0.1
  safe_device: ^1.1.4

  # ── State management ──────────────────────────────
  provider: ^6.1.2

  # ── Navigation ────────────────────────────────────
  # go_router removed as per audit

  # ── Images ────────────────────────────────────────
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  cached_network_image: ^3.3.1

  # ── UI & Icons ────────────────────────────────────
  cupertino_icons: ^1.0.6
  google_fonts: ^8.0.2
  flutter_animate: ^4.5.0

  # ── Utils ─────────────────────────────────────────
  intl: ^0.20.2
  timeago: ^3.6.1
  uuid: ^4.4.0
  http: ^1.2.1
  flutter_local_notifications: ^21.0.0
  agora_rtc_engine: ^6.5.3
  permission_handler: ^12.0.1
  shimmer: ^3.0.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"

flutter_native_splash:
  color: "#000000"
  image: "assets/images/app_icon.png"
  android: true
  ios: true
  
  android_12:
    color: "#000000"
    image: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - .env.local.json
    - assets/images/
