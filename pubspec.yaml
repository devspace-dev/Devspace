name: devspace
description: A social platform for college developers — built by devs, for devs.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.12.1
  crypto: ^3.0.3
  shared_preferences: ^2.2.3
  google_sign_in: ^6.3.0
  firebase_core: ^3.10.1
  firebase_analytics: ^11.4.1
  firebase_crashlytics: ^4.2.5


  # ── Payments ──────────────────────────────────────
  razorpay_flutter: ^1.3.5

  # ── State management ──────────────────────────────
  provider: ^6.1.2

  # ── Navigation ────────────────────────────────────
  # go_router removed as per audit

  # ── Images ────────────────────────────────────────
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1

  # ── UI & Icons ────────────────────────────────────
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0

  # ── Utils ─────────────────────────────────────────
  timeago: ^3.6.1
  uuid: ^4.4.0
  http: ^1.2.1
  flutter_local_notifications: ^17.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"

flutter_native_splash:
  color: "#0F0F12"
  image: "assets/images/app_icon.png"
  android: true
  ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
