name: devspace
description: A social platform for college developers — built by devs, for devs.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  mongo_dart: ^0.10.5
  crypto: ^3.0.3
  shared_preferences: ^2.2.3
  google_sign_in: ^6.3.0
  firebase_core: ^2.32.0
  firebase_messaging: ^14.9.4

  # ── State management ──────────────────────────────
  provider: ^6.1.2

  # ── Navigation ────────────────────────────────────
  go_router: ^13.2.0

  # ── Images ────────────────────────────────────────
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1

  # ── UI & Icons ────────────────────────────────────
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1

  # ── Utils ─────────────────────────────────────────
  timeago: ^3.6.1
  uuid: ^4.4.0
  http: ^1.2.1
  flutter_local_notifications: ^17.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
