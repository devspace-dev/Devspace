name: devspace
description: A social platform for college developers — built by devs, for devs.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Navigation
  go_router: ^13.2.0

  # UI & Icons
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1

  # Utils
  timeago: ^3.6.1
  shared_preferences: ^2.2.3
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
